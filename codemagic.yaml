workflows:
  notom-ios:
    name: No Tom - iPhone
    instance_type: mac_mini_m2
    max_build_duration: 40

    integrations:
      app_store_connect: codemagic

    environment:
      groups:
        - assinatura_apple
      xcode: latest
      vars:
        APP_NOME: "No Tom"
        BUNDLE_APP: "br.com.notomapp.safari"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'manifest.json'
          - '*.js'
          - '*.png'
          - 'codemagic.yaml'

    scripts:
      - name: Separar os arquivos da extensao
        script: |
          set -e
          rm -rf ext build
          mkdir ext
          for f in manifest.json conteudo.js motor.js pagina.js icone-48.png icone-128.png; do
            if [ ! -f "$f" ]; then echo "faltou o arquivo $f na raiz"; exit 1; fi
            cp "$f" ext/
          done
          ls -la ext

      - name: Converter para Safari
        script: |
          set -e
          xcrun safari-web-extension-converter ext \
            --project-location build \
            --app-name "$APP_NOME" \
            --bundle-identifier "$BUNDLE_APP" \
            --ios-only --swift --copy-resources \
            --no-open --no-prompt --force
          PROJ=$(find build -maxdepth 3 -name "*.xcodeproj" | head -1)
          if [ -z "$PROJ" ]; then echo "o conversor nao gerou projeto"; exit 1; fi
          echo "PROJ=$PROJ" >> $CM_ENV
          echo "projeto: $PROJ"

      - name: Identificadores, versao e icone
        script: |
          set -e
          VERSAO=$(python3 -c "import json;print(json.load(open('ext/manifest.json'))['version'])")
          NUMERO=$PROJECT_BUILD_NUMBER
          echo "versao $VERSAO, compilacao $NUMERO"

          find build -name Info.plist -not -path "*/build/Build/*" | while read P; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSAO" "$P" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSAO" "$P"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NUMERO" "$P" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NUMERO" "$P"
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P" 2>/dev/null || true
          done

          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSAO;/g" "$PROJ/project.pbxproj"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $NUMERO;/g" "$PROJ/project.pbxproj"

          PROJ="$PROJ" BUNDLE_APP="$BUNDLE_APP" python3 - <<'PY'
          import re, os
          caminho = os.environ['PROJ'] + '/project.pbxproj'
          base = os.environ['BUNDLE_APP']
          texto = open(caminho).read()
          def trocar(m):
              atual = m.group(1).strip()
              novo = base + '.Extension' if atual.endswith('.Extension') else base
              return 'PRODUCT_BUNDLE_IDENTIFIER = %s;' % novo
          texto, n = re.subn(r'PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);', trocar, texto)
          open(caminho, 'w').write(texto)
          print('identificadores ajustados em', n, 'lugares')
          PY

          find build -type d -name "AppIcon.appiconset" | while read D; do
            rm -f "$D"/*.png
            cp icone-app-1024.png "$D/icone-1024.png"
            printf '%s' '{"images":[{"filename":"icone-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$D/Contents.json"
            echo "icone aplicado: $D"
          done

      - name: Assinatura com a conta Apple
        script: |
          set -e
          keychain initialize
          IDS=$(xcodebuild -project "$PROJ" -showBuildSettings -json -alltargets 2>/dev/null \
            | python3 -c "import json,sys; print(' '.join(sorted({t['buildSettings'].get('PRODUCT_BUNDLE_IDENTIFIER','') for t in json.load(sys.stdin)} - {''})))")
          echo "identificadores: $IDS"
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "A variavel CERTIFICATE_PRIVATE_KEY nao chegou ao build."
            echo "Confira: grupo assinatura_apple no app notom, com a chave marcada como Secure."
            exit 1
          fi
          for ID in $IDS; do
            app-store-connect fetch-signing-files "$ID" \
              --type IOS_APP_STORE \
              --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
              --create
          done
          keychain add-certificates
          xcode-project use-profiles --project "$PROJ"

      - name: Compilar o ipa
        script: |
          set -e
          ESQUEMA=$(xcodebuild -list -json -project "$PROJ" \
            | python3 -c "import json,sys; s=json.load(sys.stdin)['project']['schemes']; print(next(x for x in s if 'Extension' not in x))")
          echo "esquema: $ESQUEMA"
          xcode-project build-ipa --project "$PROJ" --scheme "$ESQUEMA"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
